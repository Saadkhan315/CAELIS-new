<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <meta name="robots" content="noindex,nofollow">
  <title>Reset Password | CAELIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="update-password.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">CAELIS<span>®</span></a>
    <nav class="navigation admin-navigation"><a href="index.html">Return to storefront ↗</a></nav>
  </header>
  <main class="section-padding admin-page">
    <section class="admin-panel" style="width:min(560px,100%);margin:40px auto">
      <p class="eyebrow">ACCOUNT SECURITY</p>
      <h1 class="admin-title" style="font-size:clamp(44px,8vw,68px)">Choose a new <em>password.</em></h1>
      <p id="resetStatus" class="admin-status" role="status" aria-live="polite">Checking your secure reset link…</p>
      <form id="resetPasswordForm" class="stack-form" hidden>
        <label>New password
          <input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        </label>
        <label>Confirm new password
          <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        </label>
        <p class="muted-copy">Use at least 8 characters. A longer, unique password is better; never reuse a password from another website.</p>
        <button id="savePasswordButton" class="button button-gold" type="submit">Update password securely</button>
      </form>
      <a id="returnLink" class="text-link" href="index.html">Return to CAELIS</a>
    </section>
  </main>
  <footer class="site-footer"><p class="footer-small">CAELIS · ACCOUNT SECURITY</p></footer>
</body>
</html>
