<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAELIS Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js" defer></script></head><body><header class="site-header"><a class="wordmark" href="index.html">CAELIS<span>®</span></a><nav class="main-nav" style="display:flex"><a href="index.html">View storefront ↗</a></nav><div class="header-actions"><button class="text-button" id="signOutButton">Sign out</button></div></header><main class="section-pad admin-page"><p class="eyebrow">PRIVATE STORE MANAGEMENT</p><h1 class="admin-title">Store admin</h1><p class="muted">Only accounts promoted to admin in Supabase can manage products and orders.</p><div id="adminStatus" class="admin-status">Checking connection…</div><section id="adminLoginPanel" class="admin-panel" hidden><h2>Admin sign in</h2><form id="adminLogin" class="stack-form"><label>Email<input id="adminEmail" type="email" required></label><label>Password<input id="adminPassword" type="password" required></label><button class="button button-dark">Sign in</button></form><p id="loginMessage" class="form-message"></p></section><div id="adminWorkspace" hidden><section class="admin-panel"><p class="eyebrow">CATALOGUE</p><h2>Add a product</h2><form id="productForm" class="stack-form"><div class="form-row"><label>Product name<input id="pName" required maxlength="120" placeholder="Heavyweight essential tee"></label><label>Category<input id="pCategory" required maxlength="80" placeholder="T-shirts"></label></div><label>Description<textarea id="pDescription" rows="3" maxlength="1500"></textarea></label><label>Image URL<input id="pImage" type="url" placeholder="https://…"></label><div class="form-row"><label>Tag<input id="pTag" maxlength="40" placeholder="NEW ARRIVAL"></label><label>Visibility<select id="pPublished"><option value="true">Published</option><option value="false">Draft</option></select></label></div><div class="variant-entry"><p class="eyebrow">FIRST SIZE / COLOUR VARIANT</p><div class="form-row"><label>Size<input id="vSize" required placeholder="M"></label><label>Colour<input id="vColor" required placeholder="Black"></label></div><div class="form-row"><label>Price (PKR)<input id="vPrice" type="number" min="1" required placeholder="3500"></label><label>Opening stock<input id="vStock" type="number" min="0" required placeholder="10"></label></div><label>SKU (optional)<input id="vSku" maxlength="80" placeholder="CA-TEE-BLK-M"></label></div><button class="button button-gold" id="saveProductButton">Save product</button><p id="productMessage" class="form-message"></p></form></section><section class="admin-panel"><div class="admin-panel-heading"><h2>Products & stock</h2><button class="button button-dark" id="refreshProducts">Refresh</button></div><div id="adminProducts" class="admin-list"></div></section><section class="admin-panel"><div class="admin-panel-heading"><h2>Recent orders</h2><button class="button button-dark" id="refreshOrders">Refresh</button></div><div id="adminOrders" class="admin-list"></div></section></div></main><footer class="site-footer"><a class="wordmark footer-mark" href="index.html">CAELIS<span>®</span></a><small>Private store management</small></footer></body></html>
